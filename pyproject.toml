[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premarket-agent-scanner"
version = "0.1.0"
description = "Personal selected-universe premarket gap scanner with SQLite cache and agent-ready JSON tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
# The JSON tool layer (agent_tools) has no SDK dependency and is called directly.
# The `agent` extra adds the MCP server (mcp_server) that exposes those same
# tools over the Model Context Protocol to any MCP-capable agent frontend
# (Claude Code, opencode, codex). Install with: uv pip install -e ".[agent]".
agent = ["mcp>=1.2.0"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["app", "cli", "services", "providers", "agent_tools", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
